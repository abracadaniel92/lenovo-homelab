services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    network_mode: host
    restart: unless-stopped
    cap_add:
      - CAP_NET_ADMIN
    volumes:
      - pihole_config:/etc/pihole
      - dnsmasq_config:/etc/dnsmasq.d
    # Pi-hole v6 keeps all settings (password, upstreams, interface) in
    # /etc/pihole/pihole.toml on the pihole_config volume. Change them in the
    # web UI or with `docker exec pihole pihole-FTL --config <key> <value>`.
    # The v5 variables WEBPASSWORD, FTLCONF_LOCAL_IPV4 and PIHOLE_DNS_ are
    # ignored by v6. An FTLCONF_* variable here would override pihole.toml and
    # lock that setting in the UI, so keep them out unless that is the intent.
    environment:
      TZ: 'Europe/Skopje'

volumes:
  pihole_config:
  dnsmasq_config:
