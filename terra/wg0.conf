# Terra WireGuard client (README Part A step 3). Installed by setup-wg.sh,
# which fills in ENDPOINT (the home IP stays out of this public repo).
# The private key is read from /etc/wireguard/terra.key, made by setup-base.sh,
# so this file holds no secret.
[Interface]
Address = 10.8.0.4/32
PostUp = wg set %i private-key /etc/wireguard/terra.key

[Peer]
# lemongrab
PublicKey = U9+l52XjIEEyYph1c/MfrZBsbWVfumbvrberinB7Ijs=
Endpoint = ENDPOINT:51820
# Only lemongrab, never the home LAN or a default route.
AllowedIPs = 10.8.0.1/32
PersistentKeepalive = 25
