#!/usr/sbin/nft -f
# Terra firewall (README Part A step 5). Install: setup-base.sh, or
#   sudo install -m 0644 terra/nftables.conf /etc/nftables.conf && sudo systemctl enable --now nftables
# Nothing inbound from the work LAN. SSH and rest-server only over WireGuard,
# whose UDP replies come back as "established" because the Terra dials out.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept
        udp dport { 68, 546 } accept comment "DHCP replies"
        iifname "wg0" tcp dport { 22, 8000 } accept
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
