# Linkwarden Backup Configuration
#
# PG_DUMP_AND_DIRS, not TAR_DIR. The old config listed pgdata in SUBDIRS, but
# pgdata is mode 700 owned by uid 70 (postgres) while backups run as goce, so
# tar could not read a single file in it. TAR_DIR suppressed stderr and ended
# in `|| true`, so the failure was invisible and every archive shipped with
# data/ and meili_data/ but NO DATABASE: no bookmarks, no tags, no users.
# Found 2026-09-26 while building the restore drill. See troubleshooting-log.
#
# Tarring a live pgdata would have been wrong even if it were readable: it is a
# torn copy of a running database. pg_dump is the correct tool.
SERVICE_NAME="Linkwarden"
TYPE="PG_DUMP_AND_DIRS"
DB_CONTAINER="linkwarden-postgres"
DB_USER="postgres"
DB_NAME="postgres"
SRC_DIR="/home/docker-projects/linkwarden"
# Only data/ (the archived page snapshots, PDFs and screenshots), which is the
# one directory holding anything not reconstructible.
#
# pgdata: superseded by the dump above.
# meili_data: dropped. Its .mdb files are root-owned and unreadable as goce, so
#   it was never really being captured either, only empty directory shells. It
#   is a Meilisearch full-text index derived from the Postgres data, so it is
#   rebuildable. Trade-off: after a restore, search may be empty until
#   Linkwarden reindexes. Links, tags, collections and users all come back.
SUBDIRS="data"
DST_DIR="/mnt/ssd/backups/linkwarden"
FILENAME_PREFIX="linkwarden"
EXTENSION="tar.gz"
MAX_AGE_HOURS=96
