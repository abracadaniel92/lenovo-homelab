# Raspberry Pi (Pi-hole host) backup: freshness monitoring ONLY.
#
# backup-engine.sh does not produce this one. The Pi builds the archive itself
# (/usr/local/sbin/pi-backup.sh, pi-backup.timer 02:30) and rsyncs it here via
# a write-only rrsync key in goce's authorized_keys. Not in
# backup-all-critical.sh's SERVICES list, so the engine never runs this conf.
# DST_DIR is on the WD disk; /mnt/ssd/backups/pi is a symlink to it so
# sync-backups-to-b2.sh (--copy-links) carries it offsite.
# 14-day prune: /etc/cron.d/pi-backup-prune. See troubleshooting-log 2026-10-17.
SERVICE_NAME="Raspberry Pi"
TYPE="EXTERNAL"
DST_DIR="/mnt/ssd_1tb/backups/pi"
FILENAME_PREFIX="pi"
EXTENSION="tar.zst"
MAX_AGE_HOURS=36
# No .ok sidecar: that is written by backup-engine.sh after verifying, and the
# Pi uploads only the archive.
REQUIRE_OK="no"
