# Vaultwarden Backup Configuration
#
# SQLITE_TAR, not DOCKER_TAR: the old type stopped the container and tarred
# db.sqlite3 while excluding the -wal, which raced SQLite's shutdown checkpoint
# and silently produced archives missing recent writes. See troubleshooting-log
# 2026-09-25. SQLITE_TAR uses the online backup API and needs no downtime.
SERVICE_NAME="Vaultwarden"
TYPE="SQLITE_TAR"
SQLITE_DB="/mnt/ssd/docker-projects/vaultwarden/data/db.sqlite3"
SRC_PATH="/mnt/ssd/docker-projects/vaultwarden/data"
DST_DIR="/mnt/ssd/backups/vaultwarden"
# rsa_key.pem lives in SRC_PATH and IS required: it signs JWTs, and losing it
# invalidates every session and 2FA-remember token. icon_cache is re-downloadable
# favicons and tmp is transient, so neither is worth archiving.
EXCLUDES="./icon_cache ./tmp"
FILENAME_PREFIX="vaultwarden"
EXTENSION="tar.gz"
MAX_AGE_HOURS=48
