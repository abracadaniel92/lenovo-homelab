# Nextcloud Backup Configuration
SERVICE_NAME="Nextcloud"
TYPE="PG_DUMP_AND_TAR"
DB_CONTAINER="nextcloud-postgres"
DB_USER="nextcloud"
DB_NAME="nextcloud"
CONFIG_SRC="/mnt/ssd/apps/nextcloud/app/config"
CONFIG_FILE="config.php"
# config.php is 640 www-data:www-data, so a host-side read as goce gets EACCES.
# Setting CONFIG_CONTAINER makes the engine tar it from inside the container,
# which owns the file. CONFIG_SRC is kept as documentation of the bind mount.
CONFIG_CONTAINER="nextcloud-app"
CONFIG_CONTAINER_DIR="/var/www/html/config"
DST_DIR="/mnt/ssd/backups/nextcloud"
FILENAME_PREFIX="nextcloud"
EXTENSION="tar.gz"
MAX_AGE_HOURS=48
