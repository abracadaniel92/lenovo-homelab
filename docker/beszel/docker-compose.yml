services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: always
    profiles:
      - utilities
      - monitoring
      - all
    ports:
      - "8086:8090"   # hub web UI — LAN only, no Caddy/tunnel route
    volumes:
      - ./beszel_data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: always
    profiles:
      - utilities
      - monitoring
      - all
    # host network so the agent sees real interfaces/temps; listens on 45876
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: "45876"
      HUB_URL: http://192.168.1.97:8086
      # Add system in hub UI → copy token here, then: docker compose up -d
      TOKEN: "REPLACE_WITH_TOKEN_FROM_HUB_UI"
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL0jUfDiKystNBleS9H2nTuN4tBrzzq/a6oV4EB28cFP"
