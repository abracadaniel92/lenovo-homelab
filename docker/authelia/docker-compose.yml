services:
  redis:
    image: redis:7-alpine
    container_name: authelia-redis
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.5'
    volumes:
      - ./data/redis:/data
    networks:
      - authelia-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '0.5'
    ports:
      - "9091:9091"  # HTTP API port (using 9091 to avoid conflicts)
    volumes:
      - ./config:/config
      - ./data/users:/data/users
    networks:
      - authelia-net
    environment:
      - TZ=Europe/Belgrade
    command: ["--config", "/config/configuration.yml"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  authelia-net:
    driver: bridge
